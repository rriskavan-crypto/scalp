[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalpkit"
version = "1.0.0"
description = "BTC/USDT M5 selective-momentum scalping strategy: research, backtest, walk-forward and live signal toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# MetaTrader5 paketi FAQAT Windows uchun mavjud — shuning uchun u asosiy
# bog'liqliklarda emas. Linux/macOS'da `pip install -e .` ni buzmasligi
# kerak, aks holda backtest ham ishlamay qoladi.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=7.4"]

[project.scripts]
scalpkit = "scalpkit.cli:main"

[tool.setuptools.packages.find]
include = ["scalpkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
