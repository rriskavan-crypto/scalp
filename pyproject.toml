[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalpkit"
version = "1.0.0"
description = "BTC/USDT M5 selective-momentum scalping strategy: research, backtest, walk-forward and live signal toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.scripts]
scalpkit = "scalpkit.cli:main"

[tool.setuptools.packages.find]
include = ["scalpkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
